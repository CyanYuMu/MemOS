                  type: string
                endTime:
                  type: string
      responses:
        '200':
          $ref: '#/components/responses/UntypedRecords'
  /api/dashboard/knowledgebase/file/add:
    post:
      tags:
        - 知识库
      summary: 新增知识库文件
      description: '`file` 与 `files` 二选一；每个文件必须带 `name` 与 `content`。'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - knowledgeBaseId
              properties:
                projectId:
                  type: string
                knowledgeBaseId:
                  type: string
                type:
                  type: string
                file:
                  $ref: '#/components/schemas/KnowledgeFileInput'
                files:
                  type: array
                  items:
                    $ref: '#/components/schemas/KnowledgeFileInput'
      responses:
        '200':
          $ref: '#/components/responses/KnowledgeFileRecords'
  /api/dashboard/knowledgebase/file/delete:
    post:
      tags:
        - 知识库
      summary: 删除知识库文件
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - fileIds
              properties:
                projectId:
                  type: string
                fileIds:
                  type: array
                  items:
                    type: string
      responses:
        '200':
          description: 成功，返回删除条数
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          ok:
                            type: boolean
                          deleted:
                            type: integer
  /api/dashboard/knowledgebase/file/download:
    get:
      tags:
        - 知识库
      summary: 下载知识库文件
      description: 唯一不套 JSON 信封的接口：直接把上游文件字节以附件形式返回。
      parameters:
        - name: projectId
          in: query
          required: true
          schema:
            type: string
        - name: fileId
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 文件字节
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
  /api/dashboard/knowledgebase/memory/list:
    post:
      tags:
        - 知识库
      summary: 知识库的记忆列表
      description: 比其它列表多一个 `size` 字段。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - knowledgeBaseId
              properties:
                knowledgeBaseId:
                  type: string
                pageNum:
                  type: integer
                  default: 1
                pageSize:
                  type: integer
                  default: 10
                query:
                  type: string
                userId:
                  type: string
                triggerType:
                  type: string
                startTime:
                  type: string
                endTime:
                  type: string
      responses:
        '200':
          $ref: '#/components/responses/MemoryRecords'
  /api/dashboard/knowledgebase/project/associate:
    post:
      tags:
        - 知识库
      summary: 把知识库关联到项目
      description: 传的是该项目的**全量**知识库 id 列表，不在列表里的会被解除关联。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - projectId
                - knowledgeBaseIds
              properties:
                projectId:
                  type: string
                knowledgeBaseIds:
                  type: array
                  items:
                    type: string
      responses:
        '200':
          $ref: '#/components/responses/Ok'
  /api/dashboard/knowledgebase/project/remove:
    post:
      tags:
        - 知识库
      summary: 解除知识库与项目的关联
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - projectId
                - knowledgeBaseId
              properties:
                projectId:
                  type: string
                knowledgeBaseId:
                  type: string
                deleteAll:
                  type: boolean
                  description: 为真时连同知识库本身一起删除
      responses:
        '200':
          $ref: '#/components/responses/Ok'
  /api/dashboard/profileTemplate/list:
    post:
      tags:
