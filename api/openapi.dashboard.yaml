        content:
          application/json:
            schema:
              type: object
              properties:
                cycleId:
                  type: string
                includeAllCycles:
                  type: boolean
      responses:
        '200':
          $ref: '#/components/responses/SubscriptionDetails'
  /api/meta:
    get:
      tags:
        - 运行信息
