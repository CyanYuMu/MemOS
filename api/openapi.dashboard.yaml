      parameters:
        - name: projectId
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          $ref: '#/components/responses/Ok'
  /api/dashboard/local-sync/devices/{id}:
    delete:
      tags:
        - 本地同步
      summary: 吊销设备
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: projectId
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          $ref: '#/components/responses/Ok'
  /api/dashboard/local-sync/memories:
    get:
      tags:
        - 本地同步
      summary: 本地记忆镜像分页列表
      parameters:
        - name: projectId
          in: query
          required: true
          schema:
            type: string
        - name: layer
          in: query
          schema:
            type: string
        - name: deviceId
          in: query
          schema:
            type: string
        - name: q
          in: query
          schema:
            type: string
        - name: startTime
          in: query
          schema:
            type: string
        - name: endTime
          in: query
          schema:
            type: string
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: pageSize
          in: query
          schema:
            type: integer
            default: 20
      responses:
        '200':
          $ref: '#/components/responses/UntypedRecords'
  /api/dashboard/local-sync/memories/{id}:
    get:
      tags:
        - 本地同步
      summary: 镜像详情（含 payload）
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: projectId
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          $ref: '#/components/responses/Ok'
    delete:
      tags:
        - 本地同步
      summary: 删除镜像（只置 deleted_at，不影响本地）
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: projectId
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          $ref: '#/components/responses/Ok'
  /api/dashboard/local-sync/memories/promote:
    post:
      tags:
        - 本地同步
      summary: 批量转存到上游记忆
      parameters:
        - name: projectId
          in: query
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - ids
              properties:
                ids:
                  type: array
                  items:
                    type: string
      responses:
        '200':
          $ref: '#/components/responses/Ok'
  /api/dashboard/local-sync/summary:
    get:
      tags:
        - 本地同步
      summary: 治理摘要（按层计数与配额）
      parameters:
        - name: projectId
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          $ref: '#/components/responses/Ok'
components:
  schemas:
    ErrorEnvelope:
      type: object
      description: 错误信封。HTTP 状态码与 `code` 一起判断；`data` 按场景可能带 `errors`、`currentVersionId`、`retryAfterSec`。
      required:
        - code
        - message
      properties:
        code:
          type: integer
          description: 非 0 即失败（40000 参数、40100 未登录、40300 无权限、40001 不存在、40900 冲突、41300 超限、42900 限流、50200/50143/50300 上游与模型侧、50400 超时）
        data:
          nullable: true
          description: 失败时通常为 null；冲突、限流与校验失败带场景字段
        message:
          type: string
          description: 面向用户，只写发生了什么和怎么改
    PromptState:
      type: object
      description: 一个语言槽位的状态。`source=default` 时 `versionId` 为 0。
      properties:
        source:
          type: string
          enum:
            - default
            - project
        versionId:
          type: integer
          description: 全局自增编号，只用于接口调用与并发判断
        versionNo:
          type: integer
          description: 该槽位从 1 开始的序号，界面显示用；默认时为 0
        updatedAt:
          type: string
          nullable: true
          description: 默认槽位为 null
        author:
          type: string
          nullable: true
          description: 默认槽位为 null
    PromptItem:
      type: object
      properties:
        key:
          type: string
        group:
          type: string
          enum:
            - extract
            - process
            - dream
        title:
          type: object
          description: 语言 → 标题
          additionalProperties:
            type: string
        summary:
          type: object
          description: 语言 → 一句话说明
          additionalProperties:
            type: string
        languages:
          type: array
          items:
            type: string
        editable:
          type: boolean
        state:
          type: object
          description: 语言 → 槽位状态
          additionalProperties:
            $ref: '#/components/schemas/PromptState'
    PromptCatalog:
      type: object
      properties:
        prompts:
          type: array
          items:
            $ref: '#/components/schemas/PromptItem'
    PromptPlaceholder:
      type: object
      properties:
        name:
          type: string
        required:
          type: boolean
        description:
          type: object
          additionalProperties:
            type: string
    PromptOutputContract:
      type: object
      properties:
        format:
          type: string
        requiredKeys:
          type: array
          items:
            type: string
        itemKeys:
          type: array
          items:
            type: string
        description:
          type: object
          additionalProperties:
            type: string
    PromptSample:
      type: object
      properties:
        id:
          type: string
        lang:
          type: string
          description: 样例输入本身的语种，前端按当前所选语言过滤
        title:
          type: object
          additionalProperties:
            type: string
        input:
          type: object
          additionalProperties: true
          description: 原样透传，形状由 `inputSchema` 描述
    PromptEffective:
      type: object
      properties:
        body:
          type: string
        source:
          type: string
          enum:
            - default
            - project
        versionId:
          type: integer
        versionNo:
          type: integer
          description: 该槽位从 1 开始的序号
        updatedAt:
          type: string
          nullable: true
          description: 默认槽位为 null
        author:
          type: string
          nullable: true
          description: 默认槽位为 null
    PromptDetail:
      type: object
      properties:
        key:
          type: string
        group:
          type: string
        title:
          type: object
          additionalProperties:
            type: string
        summary:
          type: object
          additionalProperties:
            type: string
        languages:
          type: array
          items:
            type: string
        syntax:
          type: string
          description: 占位符替换方式，由记忆服务的注册表决定（如 `dollar`、`format`、`brace`）
        placeholders:
          type: array
          items:
            $ref: '#/components/schemas/PromptPlaceholder'
        lockedSuffix:
          type: string
          nullable: true
          description: 代码在用户提示词之后自动追加的文本，只读
        inputKind:
          type: string
        inputSchema:
          type: object
          additionalProperties: true
          description: 原样透传
        outputContract:
          $ref: '#/components/schemas/PromptOutputContract'
        sampleInputs:
          type: array
          items:
            $ref: '#/components/schemas/PromptSample'
        editable:
          type: boolean
        defaults:
          type: object
          description: 语言 → 内置默认全文，原样透传
          additionalProperties:
            type: string
        effective:
          type: object
          description: 语言 → 当前生效值，原样透传
          additionalProperties:
            $ref: '#/components/schemas/PromptEffective'
    PromptVersion:
      type: object
      properties:
        versionId:
          type: integer
        versionNo:
          type: integer
          description: 该槽位从 1 开始的序号（含 save/rollback/reset/migrated）
        lang:
          type: string
        kind:
          type: string
          enum:
            - save
            - reset
            - rollback
            - migrated
        body:
          type: string
        note:
          type: string
        author:
          type: string
        createdAt:
          type: string
        parentVersionId:
          type: integer
          nullable: true
    PromptVersionsData:
      type: object
      properties:
        versions:
          type: array
          items:
            $ref: '#/components/schemas/PromptVersion'
        hasMore:
          type: boolean
    PromptIssue:
      type: object
      properties:
        code:
          type: string
        message:
          type: string
          description: 面向用户，只说发生了什么和怎么改
    PromptValidation:
      type: object
      properties:
        ok:
          type: boolean
        errors:
          type: array
          items:
            $ref: '#/components/schemas/PromptIssue'
        warnings:
          type: array
          items:
            $ref: '#/components/schemas/PromptIssue'
    PromptSaveData:
      type: object
      properties:
        versionId:
          type: integer
        versionNo:
          type: integer
        createdAt:
          type: string
        effective:
          $ref: '#/components/schemas/PromptEffective'
    PromptResetItem:
      type: object
      properties:
        key:
          type: string
        lang:
          type: string
        versionId:
          type: integer
        versionNo:
          type: integer
    PromptResetData:
      type: object
      description: 实际被还原的槽位；全部已是默认时为空数组。
      properties:
        reset:
          type: array
          items:
            $ref: '#/components/schemas/PromptResetItem'
    PromptContractCheck:
      type: object
      properties:
        ok:
          type: boolean
        missing:
          type: array
          items:
            type: string
    PromptRunError:
      type: object
      properties:
        code:
          type: string
          enum:
            - llm_error
            - llm_timeout
        message:
          type: string
    PromptTestRun:
      type: object
      properties:
        label:
          type: string
          enum:
            - draft
            - default
        ok:
          type: boolean
        parseOk:
          type: boolean
        fallbackTriggered:
          type: boolean
          description: 为真表示真实抽取在这种输出下会把原文整段存成 UserMemory
        contract:
          $ref: '#/components/schemas/PromptContractCheck'
        output:
          type: object
          additionalProperties: true
          description: 原样透传，不转换键名
        rawOutput:
          type: string
        truncated:
          type: boolean
        latencyMs:
          type: integer
        model:
          type: string
        usage:
          type: object
          additionalProperties: true
          description: 开放映射，snake_case 的键转成 camelCase（如 promptTokens、completionTokens、calls）
        usedSlots:
          type: array
          description: 本次运行实际取用的模板槽位
          items:
            $ref: '#/components/schemas/PromptSlotRef'
        warnings:
          type: array
          description: 不阻止运行、但用户要知道的情况（例如草稿没有被取用）
          items:
            $ref: '#/components/schemas/PromptIssue'
        error:
          $ref: '#/components/schemas/PromptRunError'
    PromptSlotRef:
      type: object
      properties:
        key:
          type: string
        lang:
          type: string
        source:
          type: string
          enum:
            - draft
            - project
            - default
        versionId:
          type: integer
    PromptTestData:
      type: object
      properties:
        runs:
          type: array
          items:
            $ref: '#/components/schemas/PromptTestRun'
    PromptGenerateData:
      type: object
      properties:
        body:
          type: string
        validation:
          $ref: '#/components/schemas/PromptValidation'
    PromptKeyRequest:
      allOf:
        - $ref: '#/components/schemas/ProjectScopedRequest'
        - type: object
          required:
            - key
          properties:
            key:
              type: string
    PromptLangRequest:
      allOf:
        - $ref: '#/components/schemas/PromptKeyRequest'
        - type: object
          required:
            - lang
          properties:
            lang:
              type: string
    PromptVersionsRequest:
      allOf:
        - $ref: '#/components/schemas/PromptKeyRequest'
        - type: object
          properties:
            lang:
              type: string
            limit:
              type: integer
              description: 默认 20，上限 100
            beforeVersionId:
              type: integer
    PromptValidateRequest:
      allOf:
        - $ref: '#/components/schemas/PromptLangRequest'
        - type: object
          properties:
            body:
              type: string
    PromptSaveRequest:
      allOf:
        - $ref: '#/components/schemas/PromptLangRequest'
        - type: object
          properties:
            body:
              type: string
              description: 与 `restoreFromVersionId` 二选一
            restoreFromVersionId:
              type: integer
            note:
              type: string
              description: 最长 200 字符
            baseVersionId:
              type: integer
              description: 客户端看到的当前版本，默认 0
    PromptResetRequest:
      allOf:
        - $ref: '#/components/schemas/ProjectScopedRequest'
        - type: object
          properties:
            key:
              type: string
              description: 省略表示整个项目
            lang:
              type: string
              description: 省略表示该条的全部语言
    PromptTestRequest:
      allOf:
        - $ref: '#/components/schemas/PromptLangRequest'
        - type: object
          properties:
            body:
              type: string
              description: 草稿；缺省用当前生效值
            input:
              type: object
              additionalProperties: true
              description: 形状由对应注册项的 `inputSchema` 决定
            compareDefault:
              type: boolean
    PromptGenerateRequest:
      allOf:
        - $ref: '#/components/schemas/PromptLangRequest'
        - type: object
          required:
            - instruction
          properties:
            instruction:
              type: string
            baseBody:
              type: string
    Envelope:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: integer
          description: 0 表示成功；非 0 时前端按错误处理并弹出 message
        message:
          type: string
        data: {}
    Project:
      type: object
      required:
        - id
        - name
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        status:
          type: string
          enum:
            - ENABLED
            - DISABLED
          description: '`ENABLED` 的那条是当前项目'
        createTime:
          type: string
        isMultiView:
          type: integer
          enum:
            - 0
            - 1
    ProjectDictItem:
      type: object
      required:
        - id
        - name
      properties:
        id:
          type: string
        name:
          type: string
        status:
          type: string
          enum:
            - ENABLED
            - DISABLED
    ApiKey:
      type: object
      required:
        - id
        - keyName
        - apiKey
        - createTime
      properties:
        id:
          type: string
        keyName:
          type: string
        apiKey:
          type: string
          description: 完整密钥，列表里也下发，前端自己截断展示
        createTime:
          type: string
    EventType:
      type: string
      description: 调用事件类型。前 10 个出现在列表页的筛选下拉里，后 4 个只出现在详情页的字段表里。
      enum:
        - addMessage
        - searchMemory
        - getMemory
        - deleteMemory
        - addFeedback
        - manualAddMemory
        - updateMemory
        - bindProfileTemplate
        - editProfile
        - deleteProfile
        - getMessage
        - chat
        - extractMemory
        - rerank
    LogStatus:
      type: string
      description: '`SUCCESS` 与 `success` 都判为成功，其余判为失败'
    RequestLog:
      type: object
      required:
        - id
        - createTime
        - eventType
        - status
      properties:
        id:
          type: string
        createTime:
          type: string
        eventType:
          $ref: '#/components/schemas/EventType'
        userIds:
          type: array
          items:
            type: string
        agentIds:
          type: array
          items:
            type: string
        status:
          $ref: '#/components/schemas/LogStatus'
        duration:
          type: number
          description: 毫秒数，前端拼 `ms` 展示
    LogDetail:
      type: object
      required:
        - id
        - createTime
        - eventType
        - status
      properties:
        id:
          type: string
        createTime:
          type: string
        eventType:
          $ref: '#/components/schemas/EventType'
        status:
          $ref: '#/components/schemas/LogStatus'
        duration:
          type: number
        traceId:
          type: string
        userId:
          type: string
        agentId:
          type: string
        requestTokens:
          type: integer
        responseTokens:
          type: integer
        requestCode:
          type: integer
        responseCode:
          type: integer
        requestBody:
          type: string
          description: JSON 字符串，前端二次 parse
        responseBody:
          type: string
          description: JSON 字符串，前端二次 parse
    MemorySubjectType:
      type: string
      enum:
        - user
        - agent
        - public
    MemoryDetailType:
      type: string
      description: 记忆类型。`text_mem` 事实记忆、`pref_mem` 偏好记忆、`event_mem` 事件记忆、`profile_mem` 属性树记忆、`tool_mem` 工具记忆。
      enum:
        - text_mem
        - pref_mem
        - event_mem
        - profile_mem
        - tool_mem
    MemoryVersion:
      type: object
      required: [version, content, createdAt]
      properties:
        version: {type: integer}
        content: {type: string}
        createdAt: {type: string}
        updateType: {type: string}
        validFrom: {type: string}
        validTo: {type: string}
    MemorySource:
      type: object
      properties:
        type: {type: string}
        role: {type: string}
        content: {type: string}
        time: {type: string}
        url: {type: string}
    Memory:
      type: object
      required:
        - memoryId
        - memoryContent
        - createTime
      properties:
        relativity:
          type: number
          description: 该次检索的实际相关度；画像或旧快照缺失时省略
        version: {type: integer, description: 上游当前版本号}
        history:
          type: array
          items: {$ref: '#/components/schemas/MemoryVersion'}
        sources:
          type: array
          items: {$ref: '#/components/schemas/MemorySource'}
        memoryId:
          type: string
        memoryContent:
          type: string
        memoryKey:
          type: string
        memoryType:
          type: string
        status:
          type: string
        tags:
          type: array
          items:
            type: string
        updateTime:
          type: string
        subjectType:
          $ref: '#/components/schemas/MemorySubjectType'
        externalUserId:
          type: string
        createTime:
          type: string
        profileTemplateId:
          type: string
          description: '`profile_mem` 专有'
        profileInstanceId:
          type: string
          description: '`profile_mem` 专有'
    MemoryEvent:
      allOf:
        - $ref: '#/components/schemas/MemoryActivity'
        - type: object
          required: [eventId, sequence, kind, sessionId, before, memoryIds]
          properties:
            eventId:
              type: string
            sequence:
              type: string
              pattern: '^[0-9]+$'
            kind:
              type: string
              enum: [recall, add, update, delete]
            sessionId:
              type: string
            before:
              type: array
              items:
                $ref: '#/components/schemas/Memory'
            memoryIds:
              type: array
              items:
                type: string
    MemoryActivity:
      type: object
      required: [callId, status, memories, total, truncated]
      properties:
        callId:
          type: string
        status:
          type: string
          enum: [pending, succeeded, failed, unavailable, not_found]
        completedAt:
          type: string
        memories:
          type: array
          items:
            $ref: '#/components/schemas/Memory'
        total:
          type: integer
        truncated:
          type: boolean
    KnowledgeBase:
      type: object
      required:
        - kbId
        - knowledgebaseName
      properties:
        kbId:
          type: string
        knowledgebaseName:
          type: string
        knowledgebaseDescription:
          type: string
        projectIds:
          type: array
          items:
            type: string
    DocumentStatus:
      type: string
      enum:
        - waiting
        - uploading
        - processing
        - available
        - deleting
        - failed
        - processFailed
    ProfileTemplateField:
      type: object
      properties:
        value:
          type: string
        algorithm_updatable:
          type: boolean
          description: 该字段是否允许算法自动更新
    ProfileTemplateGroup:
      type: object
      description: 分组 → 字段 → `{ value, algorithm_updatable }`
      additionalProperties:
        $ref: '#/components/schemas/ProfileTemplateField'
    ProfileTemplate:
      type: object
      description: 模板对象。除下列元信息外，其余键都当作分组数据，形状是「分组 → 字段 → `{ value, algorithm_updatable }`」。
      properties:
        templateId:
          type: string
        templateName:
          type: string
        projectId:
          type: string
        bindingCount:
          type: integer
        updatedAt:
          type: string
      additionalProperties:
        $ref: '#/components/schemas/ProfileTemplateGroup'
    PromptConfig:
      type: object
      properties:
        prompt:
          type: string
        projectId:
          type: string
        updatedAt:
          type: string
    ExtractResult:
      type: object
      properties:
        type:
          $ref: '#/components/schemas/MemoryDetailType'
        content:
          type: string
    UsageDailyStat:
      type: object
      required:
        - date
      properties:
        date:
          type: string
          format: date
        addMessage:
          $ref: '#/components/schemas/UsageCalls'
        searchMemory:
          $ref: '#/components/schemas/UsageCalls'
        chat:
          $ref: '#/components/schemas/UsageTokens'
        extractMemory:
          $ref: '#/components/schemas/UsageTokens'
        rerank:
          $ref: '#/components/schemas/UsageCalls'
    UsageCalls:
      type: object
      properties:
        calls:
          type: integer
        totalTokens:
          type: integer
    UsageTokens:
      type: object
      properties:
        requestTokens:
          type: integer
        responseTokens:
          type: integer
        totalTokens:
          type: integer
    QuotaSummary:
      type: object
      properties:
        memoryCount:
          type: integer
        knowledgebaseCount:
          type: integer
        knowledgebaseCapacity:
          type: integer
        allowedKnowledgebaseCount:
          type: integer
    SubscriptionDetails:
      type: object
      properties:
        cycles:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              cycleStartTime:
                type: string
              cycleEndTime:
                type: string
        currentCycle:
          type: object
          properties:
            id:
              type: string
    ToolInfo:
      type: object
      description: 服务暴露的一个 MCP 工具，接入说明与示例命令据此生成
      properties:
        name:
          type: string
        description:
          type: string
    Meta:
      type: object
      required:
        - mode
        - keyPrefix
        - tools
      properties:
        mode:
          type: string
          enum:
            - sample
            - live
          description: '`sample` 示例后端，`live` 真实后端'
        service:
          type: string
        health:
          type: object
          nullable: true
        keyPrefix:
          type: string
          description: 新建密钥的展示与校验用它
        tools:
          type: array
          items:
            $ref: '#/components/schemas/ToolInfo'
    ProjectScopedRequest:
      type: object
      properties:
        projectId:
          type: string
    GraphNode:
      type: object
      properties:
        id:
          type: string
        label:
          type: string
        labelTruncated:
          type: boolean
        memoryType:
          type: string
        createdAt:
          type: string
        sessionId:
          type: string
        clusterId:
          type: string
          description: 固定为 `session:<sessionId>`
        userId:
          type: string
        sourceIds:
          type: array
          items:
            type: string
    GraphLink:
      type: object
      properties:
        source:
          type: string
        target:
          type: string
        kind:
          type: string
          description: 边类型，小写
    GraphStats:
      type: object
      properties:
        nodes:
          type: integer
        links:
          type: integer
        sessions:
          type: integer
        clusters:
          type: integer
        orphans:
          type: integer
          description: 没有任何边相连的节点数
        truncated:
          type: boolean
          description: 节点数触及 limit 上限时为 true
        types:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
              count:
                type: integer
    ModelEntry:
      type: object
      properties:
        role:
          type: string
        model:
          type: string
        spec:
          type: string
        source:
          type: string
        group:
          type: string
    HealthCheck:
      type: object
      properties:
        ok:
          type: boolean
        latencyMs:
          type: integer
        detail:
          type: string
          description: 失败时的机器可读短码，文案由页面按语言翻译
    KnowledgeFile:
