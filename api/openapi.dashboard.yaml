      summary: 按一句话描述生成 Prompt
      deprecated: true
      description: 已由 /api/dashboard/prompts/* 取代，保留可用；新代码不要再用。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/ProjectScopedRequest'
                - type: object
                  required:
                    - description
                  properties:
                    description:
                      type: string
      responses:
        '200':
          $ref: '#/components/responses/Prompt'
  /api/dashboard/prompt-config/reset-default:
    post:
      tags:
        - 自定义抽取
      summary: 恢复默认 Prompt
      deprecated: true
      description: 已由 /api/dashboard/prompts/* 取代，保留可用；新代码不要再用。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectScopedRequest'
      responses:
        '200':
          $ref: '#/components/responses/Prompt'
  /api/dashboard/prompt-config/debug/extract:
    post:
      tags:
        - 自定义抽取
      summary: 快速调试：对一段文本跑抽取
      deprecated: true
      description: |-
        已由 /api/dashboard/prompts/* 取代，保留可用；新代码不要再用。

        `messages` 是标准的 chat 消息数组，前端传一条 `user` 消息。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/ProjectScopedRequest'
                - type: object
                  required:
                    - messages
                  properties:
                    messages:
                      type: array
                      items:
                        type: object
                        required:
                          - role
                          - content
                        properties:
                          role:
                            type: string
                            enum:
                              - system
                              - user
                              - assistant
                          content:
                            type: string
                    extractionTypes:
                      type: array
                      items:
                        $ref: '#/components/schemas/MemoryDetailType'
      responses:
        '200':
          $ref: '#/components/responses/ExtractDebug'
  /api/dashboard/prompts/list:
    post:
      tags:
        - 提示词工作台
      summary: 提示词清单
      description: 只返回注册项摘要与各语言槽位状态，不含正文。`state` 以语言为键。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectScopedRequest'
      responses:
        '400':
          $ref: '#/components/responses/PromptInvalid'
        '401':
          $ref: '#/components/responses/ErrorUnauthorized'
        '403':
          $ref: '#/components/responses/ErrorForbidden'
        '502':
          $ref: '#/components/responses/ErrorBadGateway'
        '503':
          $ref: '#/components/responses/ErrorUnavailable'
        '200':
          $ref: '#/components/responses/PromptList'
  /api/dashboard/prompts/detail:
    post:
      tags:
        - 提示词工作台
      summary: 单条提示词详情
      description: 返回注册项全文（`inputSchema`、`sampleInputs[].input` 原样透传）、各语言内置默认与当前生效值。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PromptKeyRequest'
      responses:
        '400':
          $ref: '#/components/responses/PromptInvalid'
        '401':
          $ref: '#/components/responses/ErrorUnauthorized'
        '403':
          $ref: '#/components/responses/ErrorForbidden'
        '404':
          $ref: '#/components/responses/ErrorNotFound'
        '502':
          $ref: '#/components/responses/ErrorBadGateway'
        '503':
          $ref: '#/components/responses/ErrorUnavailable'
        '200':
          $ref: '#/components/responses/PromptDetail'
  /api/dashboard/prompts/versions:
    post:
      tags:
        - 提示词工作台
      summary: 版本历史
      description: 新到旧；`limit` 默认 20、上限 100，`beforeVersionId` 用于翻页。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PromptVersionsRequest'
      responses:
        '400':
          $ref: '#/components/responses/PromptInvalid'
        '401':
          $ref: '#/components/responses/ErrorUnauthorized'
        '403':
          $ref: '#/components/responses/ErrorForbidden'
        '404':
          $ref: '#/components/responses/ErrorNotFound'
        '502':
          $ref: '#/components/responses/ErrorBadGateway'
        '503':
          $ref: '#/components/responses/ErrorUnavailable'
        '200':
          $ref: '#/components/responses/PromptVersions'
  /api/dashboard/prompts/validate:
    post:
      tags:
        - 提示词工作台
      summary: 静态校验草稿
      description: 始终 HTTP 200；`errors` 阻止保存，`warnings` 只提示。校验规则与默认模板都在记忆服务，控制面不复制。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PromptValidateRequest'
      responses:
        '400':
          $ref: '#/components/responses/PromptInvalid'
        '401':
          $ref: '#/components/responses/ErrorUnauthorized'
        '403':
          $ref: '#/components/responses/ErrorForbidden'
        '413':
          $ref: '#/components/responses/ErrorPayloadTooLarge'
        '502':
          $ref: '#/components/responses/ErrorBadGateway'
        '503':
          $ref: '#/components/responses/ErrorUnavailable'
        '200':
          $ref: '#/components/responses/PromptValidation'
  /api/dashboard/prompts/save:
    post:
      tags:
        - 提示词工作台
      summary: 保存新版本
      description: |-
        `body` 与 `restoreFromVersionId` 二选一。`baseVersionId` 是客户端看到的当前版本（默认 0）；
        不一致时返回 409，`data.currentVersionId` 是当前生效版本。`author` 由服务端按登录账号填写。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PromptSaveRequest'
      responses:
        '401':
          $ref: '#/components/responses/ErrorUnauthorized'
        '403':
          $ref: '#/components/responses/ErrorForbidden'
        '404':
          $ref: '#/components/responses/PromptVersionNotFound'
        '413':
          $ref: '#/components/responses/ErrorPayloadTooLarge'
        '502':
          $ref: '#/components/responses/ErrorBadGateway'
        '503':
          $ref: '#/components/responses/ErrorUnavailable'
        '200':
          $ref: '#/components/responses/PromptSave'
        '400':
          $ref: '#/components/responses/PromptInvalid'
        '409':
          $ref: '#/components/responses/PromptConflict'
  /api/dashboard/prompts/reset:
    post:
      tags:
        - 提示词工作台
      summary: 还原默认
      description: 省略 `lang` 还原该条的全部语言，省略 `key` 还原整个项目；返回实际被还原的槽位。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PromptResetRequest'
      responses:
        '400':
          $ref: '#/components/responses/PromptInvalid'
        '401':
          $ref: '#/components/responses/ErrorUnauthorized'
        '403':
          $ref: '#/components/responses/ErrorForbidden'
        '404':
          $ref: '#/components/responses/ErrorNotFound'
        '502':
          $ref: '#/components/responses/ErrorBadGateway'
        '503':
          $ref: '#/components/responses/ErrorUnavailable'
        '200':
          $ref: '#/components/responses/PromptReset'
  /api/dashboard/prompts/test:
    post:
      tags:
        - 提示词工作台
      summary: 试跑草稿
      description: |-
        走真实抽取或 Dream 的同一条代码路径，只换模板，不写任何存储。`body` 缺省用当前生效值；
        `compareDefault` 为真时同时用内置默认再跑一次。模型调用失败不改变请求状态：
        `runs[].ok=false` 并带 `error`。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PromptTestRequest'
      responses:
        '401':
          $ref: '#/components/responses/ErrorUnauthorized'
        '403':
          $ref: '#/components/responses/ErrorForbidden'
        '404':
          $ref: '#/components/responses/ErrorNotFound'
        '413':
          $ref: '#/components/responses/ErrorPayloadTooLarge'
        '502':
          $ref: '#/components/responses/ErrorBadGateway'
        '503':
          $ref: '#/components/responses/ErrorUnavailable'
        '200':
          $ref: '#/components/responses/PromptTest'
        '400':
          $ref: '#/components/responses/PromptInvalid'
        '429':
          $ref: '#/components/responses/PromptBusy'
  /api/dashboard/prompts/generate:
    post:
      tags:
        - 提示词工作台
      summary: AI 改写
      description: 按一句话指令改写指定提示词，不保存；`validation` 是改写结果的静态校验。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PromptGenerateRequest'
      responses:
        '401':
          $ref: '#/components/responses/ErrorUnauthorized'
        '403':
          $ref: '#/components/responses/ErrorForbidden'
        '404':
          $ref: '#/components/responses/ErrorNotFound'
        '413':
          $ref: '#/components/responses/ErrorPayloadTooLarge'
        '502':
          $ref: '#/components/responses/ErrorBadGateway'
        '504':
          $ref: '#/components/responses/ErrorGatewayTimeout'
        '200':
          $ref: '#/components/responses/PromptGenerate'
        '400':
          $ref: '#/components/responses/PromptInvalid'
        '429':
          $ref: '#/components/responses/PromptBusy'
  /api/dashboard/usage/query:
    post:
      tags:
        - 用量
      summary: 按天聚合的用量
      description: |-
        `projectId` 传 `"all"` 时会被改写成空串再发出。`startDate` / `endDate` 格式 `YYYY-MM-DD`，默认当月 1 号到今天。

        `dailyStats` 的每项里，`extractMemory` 与 `rerank` 可能缺失，前端用可选链读。响应里除 `dailyStats` 外的字段前端没有读取。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - projectId
              properties:
                projectId:
                  type: string
                  description: 传 "all" 表示全部
                apiKeyId:
                  type: string
                startDate:
                  type: string
                  format: date
                endDate:
                  type: string
                  format: date
                includeDailyDetails:
                  type: boolean
                  default: true
      responses:
        '200':
          $ref: '#/components/responses/UsageQuery'
  /api/dashboard/models:
    get:
      tags:
        - 运行信息
      summary: 上游当前启用的模型清单
