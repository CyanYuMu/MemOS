      description: 成功，返回改写结果与校验
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/Envelope'
              - type: object
                properties:
                  data:
                    $ref: '#/components/schemas/PromptGenerateData'
    PromptConflict:
      description: |-
        提示词已被他人更新。`data.currentVersionId` 是当前生效版本的全局编号，
        `currentVersionNo` 是同一槽位显示用的序号；客户端据此刷新后再保存。
        两个字段始终存在；当前槽位已被还原成默认时值为 0（合法值），不能据此判断“字段缺失”。
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/Envelope'
              - type: object
                properties:
                  data:
                    type: object
                    properties:
                      currentVersionId:
                        type: integer
                      currentVersionNo:
                        type: integer
    PromptInvalid:
      description: 提示词没有通过校验；`data.errors` 是逐条问题，message 面向用户
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/Envelope'
              - type: object
                properties:
                  data:
                    type: object
                    properties:
                      errors:
                        type: array
                        items:
                          $ref: '#/components/schemas/PromptIssue'
    PromptBusy:
      description: 请求过于频繁；`data.retryAfterSec` 与 `Retry-After` 头给出等待秒数
      headers:
        Retry-After:
          description: 需要等待的秒数（与 `data.retryAfterSec` 相同，至少 1）
          schema:
            type: integer
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/Envelope'
              - type: object
                properties:
                  data:
                    type: object
                    properties:
                      retryAfterSec:
                        type: integer
    Ok:
