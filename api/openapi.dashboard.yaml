                - projectId
              properties:
                projectId:
                  type: string
                pageNum:
                  type: integer
                  default: 1
                pageSize:
                  type: integer
                  default: 10
      responses:
        '200':
          $ref: '#/components/responses/ProfileTemplateList'
  /api/dashboard/profileTemplate/detail:
    get:
      tags:
        - 属性树模板
      summary: 属性树模板详情
      description: 少数 GET 之一，参数走 query。
      parameters:
        - name: templateId
          in: query
