          schema:
            type: string
        - name: projectId
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          $ref: '#/components/responses/ProfileTemplate'
  /api/dashboard/profileTemplate/create:
    post:
      tags:
        - 属性树模板
      summary: 新建属性树模板
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProfileTemplate'
      responses:
        '200':
          $ref: '#/components/responses/Ok'
  /api/dashboard/profileTemplate/update:
    post:
      tags:
        - 属性树模板
      summary: 更新属性树模板
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProfileTemplate'
      responses:
        '200':
          $ref: '#/components/responses/Ok'
  /api/dashboard/profileTemplate/delete:
    post:
      tags:
        - 属性树模板
      summary: 删除属性树模板
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - projectId
                - templateId
              properties:
                projectId:
                  type: string
                templateId:
                  type: string
      responses:
        '200':
          $ref: '#/components/responses/Ok'
  /api/dashboard/prompt-config/detail:
    post:
      tags:
        - 自定义抽取
      summary: 读取抽取 Prompt
      deprecated: true
      description: 已由 /api/dashboard/prompts/* 取代，保留可用；新代码不要再用。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectScopedRequest'
      responses:
        '200':
          $ref: '#/components/responses/PromptConfig'
  /api/dashboard/prompt-config/save:
    post:
      tags:
        - 自定义抽取
      summary: 保存抽取 Prompt
      deprecated: true
      description: 已由 /api/dashboard/prompts/* 取代，保留可用；新代码不要再用。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/ProjectScopedRequest'
                - type: object
