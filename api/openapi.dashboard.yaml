  responses:
    ErrorBadRequest:
      description: 参数不合法
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    ErrorUnauthorized:
      description: 未登录或登录已过期
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    ErrorForbidden:
      description: 当前账号没有该项目的操作权限
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    ErrorNotFound:
      description: 资源不存在（例如提示词 key 不存在）
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    PromptVersionNotFound:
      description: |-
        提示词或历史版本不存在。`restoreFromVersionId` 不属于该项目的该槽位时
        数据面返回 `unknown_version`，控制面同样按不存在处理，不泄露它是否存在。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    ErrorPayloadTooLarge:
      description: 请求体或正文超过上限；`code` 为 41300
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    ErrorBadGateway:
      description: 记忆服务拒绝了请求或模型调用失败；`code` 为 50143 或 50200
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    ErrorUnavailable:
      description: 记忆服务暂时不可用；`code` 为 50300
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    ErrorGatewayTimeout:
      description: 模型响应超时；`code` 为 50400
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    PromptList:
      description: 成功，返回提示词清单
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/Envelope'
              - type: object
