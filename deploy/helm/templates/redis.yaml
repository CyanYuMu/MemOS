{{- if .Values.redis.enabled }}
{{- if and .Values.redis.auth.enabled (not .Values.redis.auth.password) }}
{{- fail "redis.auth.enabled is true but redis.auth.password is empty" }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "memos.redis.fullname" . }}
  labels:
    {{- include "memos.labels" . | nindent 4 }}
    app.kubernetes.io/component: redis
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "memos.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: redis
  template:
    metadata:
      labels:
        {{- include "memos.labels" . | nindent 8 }}
        app.kubernetes.io/component: redis
    spec:
      containers:
        - name: redis
          image: "{{ .Values.redis.image.repository }}:{{ .Values.redis.image.tag }}"
          imagePullPolicy: {{ .Values.redis.image.pullPolicy }}
          {{- if .Values.redis.auth.enabled }}
          command: ["sh", "-c", "exec redis-server --requirepass \"$REDIS_PASSWORD\""]
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "memos.redis.fullname" . }}
                  key: redis-password
          {{- end }}
          ports:
            - name: redis
              containerPort: 6379
          volumeMounts:
            {{- if .Values.redis.persistence.enabled }}
            - name: redis-data
              mountPath: /data
            {{- end }}
          resources:
            {{- toYaml .Values.redis.resources | nindent 12 }}
      volumes:
        {{- if .Values.redis.persistence.enabled }}
        - name: redis-data
          persistentVolumeClaim:
            claimName: {{ include "memos.redis.fullname" . }}-data
        {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "memos.redis.fullname" . }}
  labels:
    {{- include "memos.labels" . | nindent 4 }}
    app.kubernetes.io/component: redis
spec:
  type: ClusterIP
  ports:
    - name: redis
      port: {{ .Values.redis.service.port }}
      targetPort: redis
  selector:
    {{- include "memos.labels" . | nindent 4 }}
    app.kubernetes.io/component: redis
{{- if .Values.redis.auth.enabled }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "memos.redis.fullname" . }}
  labels:
    {{- include "memos.labels" . | nindent 4 }}
type: Opaque
stringData:
  redis-password: {{ .Values.redis.auth.password | quote }}
{{- end }}
{{- if .Values.redis.persistence.enabled }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "memos.redis.fullname" . }}-data
  labels:
    {{- include "memos.labels" . | nindent 4 }}
spec:
  accessModes:
    - ReadWriteOnce
  {{- if .Values.global.storageClass }}
  storageClassName: {{ .Values.global.storageClass | quote }}
  {{- else if .Values.redis.persistence.storageClass }}
  storageClassName: {{ .Values.redis.persistence.storageClass | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.redis.persistence.size }}
{{- end }}
{{- end }}
