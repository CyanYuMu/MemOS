{{- if .Values.memos.secret.create }}
{{- if and .Values.memos.secret.name (not .Values.memos.secret.data) }}
{{- fail "memos.secret.name is set with secret.create=true but memos.secret.data is empty; that would replace the existing Secret with nothing" }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "memos.secretName" . }}
  labels:
    {{- include "memos.labels" . | nindent 4 }}
type: Opaque
{{- if .Values.memos.secret.data }}
stringData:
  {{- range $k, $v := .Values.memos.secret.data }}
  {{ $k }}: {{ $v | quote }}
  {{- end }}
{{- end }}
{{- end }}
